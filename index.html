<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>第2次超级机器人大战 重制版</title>
</head>
<body>
  <canvas id="map"></canvas>

  <header id="hud">
    <div class="left"><span id="turn"></span><span id="phase"></span></div>
    <div class="right"><span id="objective"></span><button id="gear" aria-label="设置" title="设置">⚙</button></div>
  </header>

  <aside id="info" hidden></aside>
  <div id="menu" role="menu" hidden></div>
  <div id="forecast" hidden></div>
  <div id="battle" hidden></div>
  <div id="result" hidden></div>
  <dialog id="settings"></dialog>
  <div id="banner" hidden></div>
  <div id="toast"></div>
  <footer id="hints"></footer>

  <script type="module" src="/src/remake/main.ts"></script>
</body>
</html>
